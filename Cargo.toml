[package]
name = "phonon"
version = "0.1.0"
authors = ["Jiekang Tian"]
edition = "2024"
description = "Computational environment for molecular & material research."
readme = "README.md"
repository = "https://github.com/nmrtist/phonon"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1", features = ["derive"] }
chemx = "0.1.0"
eframe = { version = "0.34", features = ["persistence"] }
egui-phosphor = "0.12.0"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
nalgebra = "0.35.0"
rfd = "0.17"
rusqlite = { version = "0.40.0", features = ["bundled"] }
sdfrust = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "3.3.0"
uuid = { version = "1", features = ["v4"] }
# Window handle for the frosted-glass backdrop install (all platforms; the
# version lines up with eframe 0.34, both on raw-window-handle 0.6).
raw-window-handle = "0.6"

# Frosted-glass backdrop blur: macOS NSVisualEffectView vibrancy + Windows
# Acrylic, both via window-vibrancy 0.7. Linux has no portable compositor blur
# and uses a translucent-tint fallback (no extra deps).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.7"

# macOS-only AppKit interop: re-parent the effect view behind the Metal content
# and read the "Reduce Transparency" accessibility setting.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

[dev-dependencies]
pollster = "0.4"
