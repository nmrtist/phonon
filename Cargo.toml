[package]
name = "phonon"
version = "0.1.0"
authors = ["Jiekang Tian"]
edition = "2024"
description = "Computational environment for molecular & material research."
readme = "README.md"
repository = "https://github.com/nmrtist/phonon"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1", features = ["derive"] }
chemx = "0.1.0"
eframe = { version = "0.34", features = ["persistence"] }
egui-phosphor = "0.12.0"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
nalgebra = "0.35.0"
rfd = "0.17"
rusqlite = { version = "0.40.0", features = ["bundled"] }
sdfrust = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "3.3.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pollster = "0.4"
